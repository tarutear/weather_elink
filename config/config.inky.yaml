# Weather E-ink Dashboard Configuration
# Pimoroni Inky Impression 7.3" 전용 설정

location:
  city: "Suwon"
  country: "KR"
  latitude: 37.259096
  longitude: 127.079442
  timezone: "Asia/Seoul"
  display_name: "수원시 영통구"  # 화면에 표시될 이름

weather_api:
  provider: "openweathermap"  # openweathermap or kma
  update_interval: 3600  # seconds (1 hour)
  language: "kr"

display:
  width: 800
  height: 480
  mode: "hardware"  # Inky를 사용하려면 "hardware"로 설정
  color_mode: "7color"  # Inky Impression은 7색 지원!
  rotation: 0  # 0, 90, 180, 270
  display_type: "inky"  # Pimoroni Inky Impression
  render_mode: "html"  # "html" 또는 "pil" (HTML이 더 정확한 디자인)

output:
  directory: "output"
  filename_pattern: "weather_{timestamp}.png"
  keep_history: true
  max_history_files: 24  # Keep last 24 images

ui:
  show_temperature: true
  show_humidity: true
  show_wind: true
  show_pressure: true
  show_forecast: true
  forecast_hours: 12
  date_format: "%Y년 %m월 %d일 %H:%M"
  temperature_unit: "celsius"  # celsius or fahrenheit
